<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla Bot Code</title>
<style>body{font-family:-apple-system,sans-serif;text-align:center;padding:24px}#c{font-size:28px;font-weight:bold;word-break:break-all;background:#f2f2f2;padding:16px;border-radius:10px;margin:20px 0}button{font-size:24px;padding:14px 32px;border-radius:10px;border:0;background:#3e6ae1;color:#fff}</style></head>
<body><h2>Copy this code and paste it into the Tesla Bot chat</h2><div id="c"></div><button id="b">Copy</button><p id="m"></p>
<script>var p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error');document.getElementById('c').textContent=c||(e?('Error: '+e+' '+(p.get('error_description')||'')):'No code found');
document.getElementById('b').onclick=function(){navigator.clipboard.writeText(c||'').then(function(){document.getElementById('m').textContent='Copied!'})};</script></body></html>
